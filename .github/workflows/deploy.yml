name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# PREVIEW: zolang er nog [[AANLEVEREN]] in de site staat, draait hij in een submap op github.io
# met noindex. Definitief op afvalmeldpunt.nl: de drie env-regels hieronder weghalen en
# public/CNAME toevoegen met daarin alleen: afvalmeldpunt.nl
env:
  SITE_URL: https://michaelbeset-ops.github.io
  BASE_PATH: /afvalmeldpunt/
  PUBLIC_PREVIEW: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
